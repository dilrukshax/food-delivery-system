# Test configuration for Delivery Service
spring.profiles.active=test

# H2 Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate for testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (for debugging if needed)
spring.h2.console.enabled=true

# JWT Secret for testing
jwt.secret=dGVzdC1zZWNyZXQtZm9yLXRlc3RpbmctcHVycG9zZXMtb25seQ==

# Disable Eureka during testing
eureka.client.enabled=false

# Logging
logging.level.com.foodordering.deliveryservice=DEBUG
