# Test configuration for API Gateway

# Server configuration
server.port=0

# JWT Secret for testing
jwt.secret=dGVzdC1zZWNyZXQtZm9yLXRlc3RpbmctcHVycG9zZXMtb25seQ==

# Disable Eureka during testing
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Simplified Gateway configuration for testing
spring.cloud.gateway.routes[0].id=test-route
spring.cloud.gateway.routes[0].uri=http://httpbin.org
spring.cloud.gateway.routes[0].predicates[0]=Path=/test/**

# Logging
logging.level.com.foodordering.apigateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
