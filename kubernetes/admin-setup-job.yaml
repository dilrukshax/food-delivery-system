apiVersion: batch/v1
kind: Job
metadata:
  name: create-admin-user
  namespace: food-delivery
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: postgres-client
        image: postgres:15
        env:
        - name: PGHOST
          value: "postgres-service"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "user_service_db"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: POSTGRES_PASSWORD
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h $PGHOST -p $PGPORT -U $PGUSER; do
            echo "PostgreSQL is not ready yet. Waiting..."
            sleep 5
          done
          
          echo "PostgreSQL is ready. Creating admin user..."
          
          # Check if admin user already exists
          ADMIN_EXISTS=$(psql -tAc "SELECT COUNT(*) FROM users WHERE email = 'admin@fooddelivery.com';" 2>/dev/null || echo "0")
          
          if [ "$ADMIN_EXISTS" = "0" ]; then
            echo "Creating admin user..."
            psql -c "
              INSERT INTO users (uuid, email, first_name, last_name, password, phone, city, role, is_active, created_at, updated_at) 
              VALUES (
                gen_random_uuid()::text,
                'admin@fooddelivery.com',
                'System',
                'Administrator', 
                '\$2a\$10\$D4z8fmvQ5xmT4ZX8KnE.O.mGiJNtF2FJRHMnRJr6f3Q0P1Y.aS7S6',
                '+1234567890',
                'System',
                'SYSTEM_ADMIN',
                true,
                NOW(),
                NOW()
              ) ON CONFLICT (email) DO NOTHING;
            "
            echo "Admin user created successfully!"
          else
            echo "Admin user already exists. Skipping creation."
          fi
          
          echo "Admin setup completed!"
