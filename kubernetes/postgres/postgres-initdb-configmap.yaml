apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb-config
  namespace: food-delivery
data:
  init.sql: |
    CREATE DATABASE user_service_db;
    CREATE DATABASE food_delivery_restaurant_db;
    CREATE DATABASE order-service-DB;
    CREATE DATABASE payment_service_db;
    CREATE DATABASE delivery_service_db;
    CREATE DATABASE notification_service_db;

    -- Connect to user_service_db and create admin user
    \c user_service_db;
    
    -- Create admin user after tables are created (handled by application startup)
    -- This will be executed when the database is first initialized
