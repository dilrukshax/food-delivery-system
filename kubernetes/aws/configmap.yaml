apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: food-delivery
data:
  # Database configuration
  DB_HOST: "food-delivery-cluster-postgres.region.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "fooddelivery"
  
  # Service URLs (will be updated by deployment script)
  USER_SERVICE_URL: "http://user-service:8081"
  RESTAURANT_SERVICE_URL: "http://restaurant-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
  PAYMENT_SERVICE_URL: "http://payment-service:8084"
  DELIVERY_SERVICE_URL: "http://delivery-service:8085"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8086"
  
  # Spring profiles
  SPRING_PROFILES_ACTIVE: "aws"
  
  # Logging
  LOG_LEVEL: "INFO"
