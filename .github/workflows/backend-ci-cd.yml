name: Backend Services CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'kubernetes/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'kubernetes/**'
  workflow_dispatch:  # Allow manual triggers
    inputs:
      force_deploy:
        description: 'Force deployment even without backend changes'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-west-2
  EKS_CLUSTER_NAME: food-delivery-cluster
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com

jobs:
  # Detect which services have changes
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      any_changes: ${{ steps.changes.outputs.any_changes }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect service changes
      id: changes
      run: |
        # Get list of changed files
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }})
        else
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        fi
        
        echo "Changed files:"
        echo "$CHANGED_FILES"
        
        # Define all backend services
        ALL_SERVICES=("api-gateway" "user-service" "restaurant-service" "order-service" "payment-service" "delivery-service" "notification-service" "service-registry")
        CHANGED_SERVICES=()
        
        # Check if each service has changes
        for service in "${ALL_SERVICES[@]}"; do
          if echo "$CHANGED_FILES" | grep -q "backend/$service/"; then
            CHANGED_SERVICES+=("\"$service\"")
            echo "🔄 Service $service has changes"
          fi
        done
        
        # Check for global changes that affect all services
        if echo "$CHANGED_FILES" | grep -qE "(docker-compose\.yml|kubernetes/|\.github/workflows/backend-ci-cd\.yml)"; then
          echo "🌍 Global backend changes detected, building all services"
          CHANGED_SERVICES=()
          for service in "${ALL_SERVICES[@]}"; do
            CHANGED_SERVICES+=("\"$service\"")
          done
        fi
        
        # Force deploy if manual trigger with force_deploy=true
        if [ "${{ github.event.inputs.force_deploy }}" = "true" ]; then
          echo "🚀 Force deploy triggered, building all services"
          CHANGED_SERVICES=()
          for service in "${ALL_SERVICES[@]}"; do
            CHANGED_SERVICES+=("\"$service\"")
          done
        fi
        
        # Create JSON array
        if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
          echo "services=[]" >> $GITHUB_OUTPUT
          echo "any_changes=false" >> $GITHUB_OUTPUT
          echo "ℹ️ No backend services have changes"
        else
          SERVICES_JSON="[$(IFS=,; echo "${CHANGED_SERVICES[*]}")]"
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
          echo "any_changes=true" >> $GITHUB_OUTPUT
          echo "✅ Services to build: $SERVICES_JSON"
        fi

  # Test and build backend services
  test-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build ${{ matrix.service }}
      run: |
        cd backend/${{ matrix.service }}
        chmod +x ./mvnw
        ./mvnw clean compile

    - name: Run tests for ${{ matrix.service }}
      run: |
        cd backend/${{ matrix.service }}
        ./mvnw test

    - name: Package ${{ matrix.service }}
      run: |
        cd backend/${{ matrix.service }}
        ./mvnw package -DskipTests

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.service }}-jar
        path: backend/${{ matrix.service }}/target/*.jar

  # Build and push Docker images
  build-and-push:
    needs: [detect-changes, test-backend]
    if: needs.detect-changes.outputs.any_changes == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.service }}-jar
        path: backend/${{ matrix.service }}/target/

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Create ECR repository if not exists
      run: |
        aws ecr describe-repositories --repository-names ${{ matrix.service }} --region ${{ env.AWS_REGION }} || \
        aws ecr create-repository --repository-name ${{ matrix.service }} --region ${{ env.AWS_REGION }}

    - name: Build, tag, and push Docker image
      env:
        ECR_REPOSITORY: ${{ matrix.service }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend/${{ matrix.service }}
        
        echo "Building Docker image for ${{ matrix.service }}"
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        
        echo "Pushing Docker image for ${{ matrix.service }}"
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "✅ Successfully pushed ${{ matrix.service }} image"

  # Deploy backend services to EKS
  deploy-backend:
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.any_changes == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Update kube config
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Create namespace and ECR secret
      run: |
        kubectl create namespace food-delivery --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret docker-registry ecr-secret \
          --docker-server=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com \
          --docker-username=AWS \
          --docker-password=$(aws ecr get-login-password --region ${{ env.AWS_REGION }}) \
          --namespace=food-delivery \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy infrastructure components
      run: |
        echo "🚀 Deploying backend infrastructure..."
        
        # Apply base configurations
        kubectl apply -f kubernetes/namespace.yaml || true
        kubectl apply -f kubernetes/configmap.yaml || true
        kubectl apply -f kubernetes/secrets.yaml || true
        
        # Deploy PostgreSQL first (if not already running)
        if [ -d "kubernetes/postgres" ]; then
          echo "📦 Deploying PostgreSQL..."
          kubectl apply -f kubernetes/postgres/
          kubectl rollout status deployment/postgres -n food-delivery --timeout=300s || true
        fi

    - name: Update and deploy changed services
      env:
        IMAGE_TAG: ${{ github.sha }}
        CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
      run: |
        echo "🔄 Updating deployment images for changed services..."
        echo "Changed services: $CHANGED_SERVICES"
        
        # Parse the JSON array of services
        SERVICES=$(echo $CHANGED_SERVICES | jq -r '.[]')
        
        for service in $SERVICES; do
          echo "📦 Deploying $service..."
          
          # Update image tag in deployment file
          if [ -f "kubernetes/${service}/deployment.yaml" ]; then
            sed -i "s|image: .*${service}:.*|image: $ECR_REGISTRY/${service}:$IMAGE_TAG|g" kubernetes/${service}/deployment.yaml
            
            # Apply the deployment
            kubectl apply -f kubernetes/${service}/
            echo "✅ Applied deployment for $service"
          else
            echo "⚠️ Deployment file not found for $service"
          fi
        done

    - name: Wait for deployments to be ready
      env:
        CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
      run: |
        echo "⏳ Waiting for deployments to be ready..."
        
        # Parse the JSON array of services
        SERVICES=$(echo $CHANGED_SERVICES | jq -r '.[]')
        
        for service in $SERVICES; do
          echo "Waiting for $service deployment..."
          kubectl rollout status deployment/$service -n food-delivery --timeout=600s || {
            echo "❌ Deployment $service failed or timed out"
            kubectl describe deployment $service -n food-delivery
            kubectl logs -l app=$service -n food-delivery --tail=50
          }
        done

    - name: Deploy ingress and final configurations
      run: |
        echo "🌐 Deploying ingress and final configurations..."
        kubectl apply -f kubernetes/ingress.yaml || echo "⚠️ Ingress not found"

    - name: Run post-deployment setup
      run: |
        echo "🔧 Running post-deployment setup..."
        
        # Create admin user (only if admin-setup-job exists)
        if [ -f "kubernetes/admin-setup-job.yaml" ]; then
          echo "👤 Creating admin user..."
          kubectl apply -f kubernetes/admin-setup-job.yaml || echo "⚠️ Admin setup job not found"
          kubectl wait --for=condition=complete job/create-admin-user -n food-delivery --timeout=120s || echo "⚠️ Admin setup job timeout"
        fi

    - name: Get deployment status
      run: |
        echo "📊 === Deployment Status ==="
        kubectl get pods -n food-delivery -o wide
        echo ""
        echo "🔌 === Services ==="
        kubectl get services -n food-delivery
        echo ""
        echo "🌐 === Ingress ==="
        kubectl get ingress -n food-delivery
        echo ""
        
        # Get application URL
        echo "🔗 Getting application URL..."
        sleep 30  # Wait for load balancer
        LB_URL=$(kubectl get ingress food-delivery-ingress -n food-delivery -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        
        if [ -n "$LB_URL" ]; then
          echo "🎉 Backend services available at: http://$LB_URL"
        else
          echo "⏳ Load balancer is still being created. Check status with:"
          echo "kubectl get ingress -n food-delivery"
        fi
        
        echo ""
        echo "🚀 Backend deployment completed!"

  # Summary job
  summary:
    needs: [detect-changes, deploy-backend]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Deployment Summary
      run: |
        echo "## 🚀 Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.detect-changes.outputs.any_changes }}" = "true" ]; then
          echo "✅ **Services deployed:** ${{ needs.detect-changes.outputs.services }}" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Image tag:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy-backend.result }}" = "success" ]; then
            echo "🎉 **Status:** Deployment successful!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Deployment failed!" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "ℹ️ **Status:** No backend changes detected, skipped deployment" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📋 **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "🌿 **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "👤 **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
