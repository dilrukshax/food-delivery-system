apiVersion: v1
kind: Namespace
metadata:
  name: food-delivery
  labels:
    name: food-delivery
    environment: dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: food-delivery
data:
  # Database configuration
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_PROFILES_ACTIVE: "kubernetes"
  
  # Service URLs (internal cluster communication)
  USER_SERVICE_URL: "http://user-service:8081"
  RESTAURANT_SERVICE_URL: "http://restaurant-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
  PAYMENT_SERVICE_URL: "http://payment-service:8084"
  DELIVERY_SERVICE_URL: "http://delivery-service:8085"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8086"
  API_GATEWAY_URL: "http://api-gateway:8080"
  
  # Eureka Service Registry
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://service-registry:8761/eureka"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: food-delivery
type: Opaque
data:
  # These will be populated by the CI/CD pipeline
  SPRING_DATASOURCE_PASSWORD: "" # Base64 encoded
  POSTGRES_CONNECTION_STRING: "" # Base64 encoded
